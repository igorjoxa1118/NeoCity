# Переменные модификаторов
# Определяем основную клавишу-модификатор, обычно это клавиша Win/Super.
set $mod Mod4
# Определяем дополнительную клавишу-модификатор, обычно это клавиша Alt.
set $mod1 Mod1

# Закрытие текущего окна
bindsym $mod+q kill

# Установка клавиши для управления плавающими окнами
# ВНИМАНИЕ: Эта строка автоматически создает привязки $mod+button1 (move) и $mod+button3 (resize),
# поэтому явные bindsym для них НЕНУЖНЫ и были удалены.
floating_modifier $mod

# --- УДАЛЕНЫ ДУБЛИРУЮЩИЕ bindsym ---
# bindsym --whole-window $mod+button1 move
# bindsym --whole-window $mod+button3 resize
# -----------------------------------

# Переключение фокуса на соседнее окно
bindsym $mod+j focus left
bindsym $mod+k focus down
bindsym $mod+l focus up
bindsym $mod+semicolon focus right
# Альтернативные клавиши для переключения фокуса на соседнее окно
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# Переход на следующее рабочее пространство
bindsym Ctrl+mod1+Right workspace next
# Переход на предыдущее рабочее пространство
bindsym Ctrl+mod1+Left workspace prev

# Перемещение активного окна на рабочее пространство слева
bindsym Ctrl+Left exec i3-msg move container to workspace $ws-left
# Перемещение активного окна на рабочее пространство справа
bindsym Ctrl+Right exec i3-msg move container to workspace $ws-right

# Разделение окон по горизонтали
bindsym $mod+h split h
# Разделение окон по вертикали
bindsym $mod+v split v

# Переключение полноэкранного режима для окна
bindsym $mod+f fullscreen toggle

# Переключение раскладки окон на стопку
bindsym $mod+mod1+x layout stacking
# Переключение раскладки окон на вкладки
bindsym $mod+mod1+z layout tabbed
# Переключение между горизонтальным и вертикальным разделением окон
bindsym $mod+z layout toggle split

# Переключение плавающего режима для окна
bindsym $mod+c floating toggle
# Переключение режима "липкое" окно (отображается на всех рабочих пространствах)
bindsym $mod+g sticky toggle

# Переключение на рабочие пространства 1-10
bindsym $mod+1 workspace $ws1
bindsym $mod+2 workspace $ws2
bindsym $mod+3 workspace $ws3
bindsym $mod+4 workspace $ws4
bindsym $mod+5 workspace $ws5
bindsym $mod+6 workspace $ws6
bindsym $mod+7 workspace $ws7
bindsym $mod+8 workspace $ws8
bindsym $mod+9 workspace $ws9
bindsym $mod+0 workspace $ws10

# Перемещение окна на рабочие пространства 1-10
bindsym $mod+Shift+1 move container to workspace $ws1
bindsym $mod+Shift+2 move container to workspace $ws2
bindsym $mod+Shift+3 move container to workspace $ws3
bindsym $mod+Shift+4 move container to workspace $ws4
bindsym $mod+Shift+5 move container to workspace $ws5
bindsym $mod+Shift+6 move container to workspace $ws6
bindsym $mod+Shift+7 move container to workspace $ws7
bindsym $mod+Shift+8 move container to workspace $ws8
bindsym $mod+Shift+9 move container to workspace $ws9
bindsym $mod+Shift+0 move container to workspace $ws10

# Перезагрузка конфигурации i3
bindsym $mod+shift+e reload
# Перезапуск i3
bindsym $mod+shift+r restart
# Выход из i3 через скрипт
bindsym $mod+mod1+Delete exec "$i3_scripts/i3-logout"
# Блокировка экрана
bindsym $mod+mod1+l exec --no-startup-id "/usr/bin/virlock"

# Переход в режим изменения размера окон
bindsym $mod+Ctrl+r mode "resize"

# Отправка окна в scratchpad
#bindsym $mod1+b move scratchpad
# Показать/скрыть окно из scratchpad
#bindsym $mod1+n scratchpad show
# Переключение видимости окна в scratchpad
#bindsym $mod1+m scratchpad toggle

# Переключение фокуса между тайловыми и плавающими окнами
bindsym $mod1+x focus mode_toggle

# Фокусировка родительского контейнера
bindsym $mod+a focus parent

# Фокусировка дочернего контейнера
bindsym $mod1+d focus child

# Запуск меню приложений
bindsym $mod+d exec --no-startup-id "$i3_scripts/OpenApps --menu"
# Запуск терминала
bindsym $mod+Return exec --no-startup-id "$i3_scripts/OpenApps --terminal"
# Переход в режим управления отступами (gaps)
bindsym $mod+Shift+g mode "$mode_gaps"
# Запуск Eww панели (закомментировано)
#bindsym $mod+Tab exec --no-startup-id "$i3_scripts/launch_eww.sh"
# Запуск файлового менеджера Yazi
bindsym $mod+$mod1+Return exec --no-startup-id "$i3_scripts/OpenApps --yazi"
# Запуск файлового менеджера Ranger
bindsym $mod1+Return exec --no-startup-id "$i3_scripts/OpenApps --ranger"
# Запуск скрипта для смены обоев
bindsym $mod+$mod1+w exec --no-startup-id "$i3_scripts/WallSelect -t 1"
# Подсветка активного окна
bindsym $mod+b exec --no-startup-id "flash_window"
# Проверка обновлений системы
bindsym $mod+$mod1+u exec --no-startup-id "$i3_scripts/OpenApps --checkupdates"
# Запуск плавающего приложения
bindsym $mod1+t exec --no-startup-id "$i3_scripts/OpenApps --floating"
# Запуск скрипта обновления системы
bindsym $mod1+u exec --no-startup-id "$i3_scripts/OpenApps --update"
# Запуск селектора конфигураций
bindsym $mod1+space exec --no-startup-id "$i3_scripts/RiceSelector"
# Запуск скрипта для выбора терминала
bindsym $mod+$mod1+t exec --no-startup-id "$i3_scripts/Term --selecterm"
# Переключение композитора
bindsym $mod+$mod1+p exec --no-startup-id "$i3_scripts/toggle-compositor.sh"
# Поиск и фокус на Thunar (закомментировано)
#bindsym $mod1+q exec --no-startup-id "$i3_scripts/findapp thunar"
# Запуск справки по горячим клавишам
bindsym $mod1+Ctrl+k exec "$i3_scripts/KeybindingsHelp"
# Запуск браузера Firefox
bindsym $mod1+f exec --no-startup-id "firefox"
# Запуск Skippy-XD
bindsym $mod1+s exec --no-startup-id "skippy-xd"
# Запуск текстового редактора Mousepad
bindsym $mod1+e exec --no-startup-id "mousepad"
# Запуск файлового менеджера Thunar
bindsym $mod1+c  exec --no-startup-id "thunar"
# Запуск Kazam для записи видео
bindsym Print exec --no-startup-id "$i3_scripts/screenshot.sh"
# Запуск скрипта для видео-меню
bindsym $mod+$mod1+v exec --no-startup-id "$local/rofi_video_dmenu/Launch.sh"
# Убийство окна по клику мыши
bindsym $mod+shift+k  exec xkill
# Запуск Flameshot для скриншотов
bindsym $mod+Shift+s exec --no-startup-id "flameshot gui"
# Перезагрузка polybar
bindsym Ctrl+$mod1+w exec --no-startup-id "$i3_scripts/toggle_polybar.sh"