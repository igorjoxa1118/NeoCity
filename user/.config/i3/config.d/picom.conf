#  ██████  ██ ██      ██    ██ ██ ████ ██  #
#  ██      ██ ██      ██    ██ ██  ██  ██  #
#  ██      ██  ██████  ██████  ██      ██  #
                                       
#################################
#       Главные настройки       #
#################################

backend = "glx";
vsync = true;
use-damage = true;
xrender-sync-fence = true;

## ----- Тени ----- ##
shadow = true;
shadow-radius = 25;
shadow-offset-x = -25;
shadow-offset-y = -25;
shadow-opacity = 0.8;

## ----- Затухание ----- ##
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 10;
fade-time = 300;
fade-duration = 400;
no-fading-openclose = true;
no-fading-destroyed-argb = true;

## ----- Прозрачность ----- ##
frame-opacity = 1.0;

## ----- Скругление углов (глобально) ----- ##
corner-radius = 10;


#################################
#            Правила            #
#################################

blur:
{
    method = "dual_kawase";
    size = 15;
    strength = 8;
    deviation = 20;
}

rules: (
    # Базовые настройки
    {
        match = "class_g = 'Polybar'";
        shadow = false;         # ГАСИМ ТЕНЬ, чтобы не было треугольников
        corner-radius = 0;      # Polybar сам скруглит углы
        blur-background = false;
        fade = true;
    },
    {
        blur-background = true;
        blur-background-frame = false;
        blur-kern = "3x3box";
        fade = true;
    },

    # Общие правила для типов окон
    {
        match = "window_type = 'normal'";
        fade = true;
        shadow = true;
        shadow-radius = 25;
        shadow-color = "#89b4fa";
    },
    {
        match = "window_type = 'dialog'";
        opacity = 0.8;
        shadow = true;
        shadow-radius = 25;
        shadow-color = "#89b4fa";
    },
    {
        match = "window_type = 'tooltip'";
        corner-radius = 10;
        opacity = 0.8;
        shadow = true;
        shadow-radius = 25;
        shadow-color = "#89b4fa";
    },
    {
        match = "window_type = 'dock'";
        corner-radius = 10;
        fade = true;
    },

    # Убираем скругление для ВСЕХ полноэкранных окон
    {
        match = "fullscreen";
        corner-radius = 0;
    },

    # Исключение для некоторых приложений (например, плееров)
    {
        match = "class_g = 'mpv' && fullscreen";
        corner-radius = 0;
    },

    # Правила скругления углов для приложений
    {
        match = "class_g = 'Polybar'      ||"
                "class_g = 'eww-bar'      ||"
                "class_g = 'Viewnior'     ||"
                "class_g = 'Rofi'         ||"
                "class_g = 'mpv'          ||"
                "class_g = 'scratch'      ||"
                "class_g = 'Dunst'        ||"
                "class_g = 'retroarch'";
        corner-radius = 10;
    },

    # Основные правила прозрачности
    {
        match = "class_g = 'code-oss' || class_g = 'jetbrains-studio' || class_g = 'Alacritty' || class_g = 'Polybar'";
        opacity = 0.8;
        blur-background = true;
    },

    # Правила для Kitty
    {
        match = "class_g = 'kitty'";
        opacity = 1;
        blur-background = false;
        shadow = false;
    },

    # Специальные правила для Firefox
    {
        match = "class_g = 'firefox' && !fullscreen && !(name *= 'Картинка в картинке')";
        opacity = 0.8;
        blur-background = true;
    },
    {
        match = "class_g = 'firefox' && (fullscreen || name *= 'Картинка в картинке')";
        opacity = 1.0;
        blur-background = false;
    },

    # Специальные правила для Zen Browser
    {
        match = "class_g = 'zen' && !fullscreen && !(name *= 'Картинка в картинке')";
        opacity = 0.8;
        blur-background = true;
    },
    {
        match = "class_g = 'zen' && (window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_role = 'Popup')";
        corner-radius = 10;
        blur-background = true;
        shadow = true;
        opacity = 0.5;
    },
    {
        match = "class_g = 'zen' && (fullscreen || name *= 'Картинка в картинке')";
        opacity = 1.0;
        blur-background = false;
    },

    # Специальные правила для brave-browser
    {
        match = "class_g = 'Brave-browser' && !fullscreen && !(name *= 'Картинка в картинке')";
        opacity = 0.8;
        blur-background = true;
    },
    {
        match = "class_g = 'Brave-browser' && (window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_role = 'Popup')";
        corner-radius = 10;
        blur-background = true;
        shadow = true;
        opacity = 0.5;
    },
    {
        match = "class_g = 'Brave-browser' && (fullscreen || name *= 'Картинка в картинке')";
        opacity = 1.0;
        blur-background = false;
    },
    
    # Исключение скругления углов для Polybar
    {
        match = "class_g = 'Polybar'";
        corner-radius = 0;
    },

    # Исключение теней для приложений
    {
        match = "name = 'Notification'          ||"
                "class_g ?= 'Notify-osd'        ||"
                "class_g = 'scratch'            ||"
                "class_g = 'Spotify'            ||"
                "class_g = 'retroarch'          ||"
                "class_g = 'Rofi'              ||"
                "class_g = 'Screenkey'         ||"
                "class_g = 'mpv'               ||"
                "class_g = 'Viewnior'          ||"
                "class_g = 'kitty'             ||"
                "_GTK_FRAME_EXTENTS@";
        shadow = false;
    },

    # Исключение прозрачности для сайтов в полноэкранном режиме и PiP
    {
        match = "(name %= '*- YouTube*'                                  ||"
                 "name *= 'Netflix'                                      ||"
                 "name %= '*бесплатно — Mozilla Firefox*'                ||"
                 "name %= '*качестве — Mozilla Firefox*') && (fullscreen ||"
                 "name *= 'Картинка в картинке')";
        opacity = 1.0;
        blur-background = false;
    },

    # Дополнительные правила прозрачности
    {
        match = "class_g = 'Xfce4-terminal'     ||"
                "class_g = 'Deadbeef'           ||"
                "class_g = 'Dunst'              ||"
                "class_g = 'discord'            ||"
                "class_g = 'Virt-manager'       ||"
                "class_g = 'easyeffects'        ||"
                "class_g = 'qpwgraph'           ||"
                "class_g = 'Gnome-mines'        ||"
                "class_g = 'TelegramDesktop'    ||"
                "class_g = 'Thunar'             ||"
                "class_g = 'Caja'               ||"
                "class_g = 'Cherrytree'         ||"
                "class_g = 'FileZilla'          ||"
                "class_g = 'Ymuse'              ||"
                "class_g = 'Nm-applet'          ||"
                "class_g = 'NetworkManager'     ||"
                "class_g = 'qBittorrent'        ||"
                "class_g = 'transmission-gtk'   ||"
                "class_g = 'Kazam'              ||"
                "class_g = 'i3-frame'           ||"
                "class_g = 'SimpleScreenRecorder' ||"
                "class_g = 'Eww'";
        opacity = 0.8;
        blur-background = true;
    },

    # Правила для верхней панели Polybar (тень только снизу)
    {
        match = "class_g = 'Polybar' && !_NET_WM_STATE@:32a = '_NET_WM_STATE_BELOW'";
        shadow = false;
        shadow-radius = 25;
        shadow-offset-x = 0;
        shadow-offset-y = 5;
        shadow-color = "#eba0ac";
        shadow-opacity = 0.8;
        shadow-exclude = [
            "! name~=''",
            "name = 'Notification'",
            "class_g ?= 'Notify-osd'",
            "class_g = 'Cairo-clock'",
            "_GTK_FRAME_EXTENTS@:c"
        ];
    },

    # Правила для нижней панели Polybar (тень только сверху)
    {
        match = "class_g = 'Polybar' && _NET_WM_STATE@:32a = '_NET_WM_STATE_BELOW'";
        shadow = false;
        shadow-radius = 25;
        shadow-offset-x = 0;
        shadow-offset-y = -5;
        shadow-color = "#eba0ac";
        shadow-opacity = 0.8;
        shadow-exclude = [
            "! name~=''",
            "name = 'Notification'",
            "class_g ?= 'Notify-osd'",
            "class_g = 'Cairo-clock'",
            "_GTK_FRAME_EXTENTS@:c"
        ];
    },

    # Правила исключения для tint2
    {
        match = "class_g = 'tint2'";
        shadow = false;
        blur-background = false;
        fade = false;
        corner-radius = 0;
        animations = false;
    },
    
    @include "picom-animations.conf"
)