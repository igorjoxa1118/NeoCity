### --- Назначение приложений на рабочие пространства ---
# Назначаем терминалы на рабочее пространство 1
assign [class="(?i)xfce4-terminal|alacritty|xterm|htop"] $ws1
# Назначаем браузеры на рабочее пространство 2
assign [class="(?i)firefox|chromium|vivaldi-stable|zen"] $ws2
# Назначаем текстовые редакторы и IDE на рабочее пространство 3
assign [class="(?i)mousepad|leafpad|code"] $ws3
# Назначаем файловые менеджеры на рабочее пространство 4
assign [class="(?i)thunar|caja"] $ws4
# Назначаем графические редакторы и программы для 3D на рабочее пространство 5
assign [class="(?i)blender|PureRef|krita|gimp|untitled - ArmorPaint|untitled - ArmorLab"] $ws5
# Назначаем мессенджеры на рабочее пространство 6
assign [class="(?i)fractal|telegram|discord"] $ws6
# Назначаем мультимедиа и игровые приложения на рабочее пространство 7
assign [class="(?i)smplayer|vlc|kodi|retroarch|parole|Spacefm|yad|ymuse|mpv|Hypnotix.py|Steam"] $ws7
# Назначаем утилиты для скриншотов и торрент-клиенты на рабочее пространство 8
assign [class="(?i)ristretto|simplescreenrecorder|qBittorrent|transmission-gtk"] $ws8
# Назначаем виртуальные машины на рабочее пространство 9
assign [class="(?i)virtualbox|Virt-manager"] $ws9


