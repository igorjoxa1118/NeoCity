### --- Правила для окон ---
# Делаем плавающими и центрируем всплывающие окна и диалоги
for_window [window_role="pop-up|bubble|task_dialog|Preferences|setup|dialog|utility"] floating enable, move position center
# Изменяем размер и центрируем окна диалогов выбора файлов, убедившись, что они плавающие
for_window [window_role="GtkFileChooserDialog|QtFileDialog"] floating enable, resize set 1280 800, move position center
# Делаем плавающими, изменяем размер и перемещаем на скрэтчпад окна с ролью "demo"
for_window [window_role="demo"] move window to scratchpad, scratchpad show, floating enable, resize set 1280 800, move absolute position 0 518
# Делаем плавающими, изменяем размер и перемещаем на скрэтчпад окна с классом "demo"
for_window [class="(?i)demo"] move window to scratchpad, scratchpad show, floating enable, resize set 1280 800, move absolute position 0 418
# Делаем плавающими и центрируем специфичные приложения
for_window [class="(?i)nitrogen|engrampa|flameshot|file-roller|fsearch|qt5ct|PureRef|lxappearance|pavucontrol|atril|viewnior|keepassxc|veracrypt"] floating enable, resize set 900 500, move position center
# Делаем плавающим, центрируем и фокусируем окно SimpleScreenRecorder
for_window [class="(?i)simplescreenrecorder"] floating enable, move position center, focus
# Фокусируем файловые менеджеры при их открытии
for_window [class="(?i)thunar|caja"] focus
# Фокусируем определённые приложения при их открытии
for_window [class="(?i)firefox|zen|vivaldi-stable|code|mousepad|mupdf|blender|gimp|krita|telegram-desktop|discord|kodi|kitty|alacritty|ymuse|vlc"] focus
# Специальное правило для окна с заголовком "floating"
for_window [title="floating"] move window to scratchpad, scratchpad show, floating enable, resize set 1280 800, move position center, focus
for_window [class="Idesk"] floating enable
for_window [instance="idesk"] floating enable
### --- Исключения для полноэкранных игр ---
#for_window [class="Steam"] fullscreen enable
#for_window [class="hl2_linux"] fullscreen enable, border none

