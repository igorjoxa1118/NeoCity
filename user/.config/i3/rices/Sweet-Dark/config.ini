[global/wm]

margin-bottom = 0
margin-top = 0

include-file = ~/.config/i3/config.d/system.ini
include-file = modules.ini

[color]
bg = #161925
bg-alt = #00161925
lbg= #181b28
fg = #C3C7D1
mb = #292745
pink-bg = #de3e80
select = #c50ed2
selected-dark = #bc245d

trans = #00000000
white = #fefefe
black = #000

red = #e6133e
pink = #de3e80
purple = #a56de2
violet = #7239b3
kivi = #00ffcc
blue = #3689e6
cyan = #28bca3
teal = #0e9a83
green = #0096b1
lime = #68b723
yellow = #f9c440
amber = #d48e15
orange = #f37329
brown = #715344
grey = #273445
indigo = #0d52bf
blue-gray = #485a6c

[bar/main]
monitor = ${env:MONITOR:}
dpi = ${env:DPI:}
monitor-strict = false
override-redirect = false

bottom = true
fixed-center = false

width = 100%
height = 20

; offset-x = 2.5%
; offset-y = 10

background = ${color.bg}
foreground = ${color.fg}

radius-bottom = 1

line-size = 3
line-color = ${color.blue}

border-size = 14
border-color = ${color.bg}

padding-left = 0
padding-right = 0

module-margin-left = 0
module-margin-right = 0

font-0 = "JetBrainsMono:style=Bold:pixelsize=9;2"
font-1 = "Material Design Icons Desktop:size=14;3"
font-2 = "Font Awesome 6 Free Solid:size=10;3"
font-3 = "MesloLGS NF:style=Regular:size=13;3"

;Modules availables but not active: 
;	battery		brightness		weather
modules-left = launcher sep2 i3 sep2 title
modules-center = 
modules-right = weather sep usercard sep mplayer sep battery sep bgi updates bgd bri filesystem brd byi cpu_bar byd bpi memory_bar bpd bbi pulseaudio bbd boi network bod bii date bid sep tray sep power

separator = 
dim-value = 1.0
;locale = es_MX.UTF-8

wm-restack = i3
enable-ipc = true

cursor-click = pointer
cursor-scroll = 

[settings]

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false
