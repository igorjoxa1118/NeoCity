;-------------------------
; Separators for Polybar - Chicago95 Edition
;--------------------------

[module/slash]
type = custom/text
content = %{T7}/%{T-}
content-background = ${colors.background}
; Используем серый цвет тени для имитации классического разделителя
content-foreground = ${colors.shadow}
content-font = 7

[module/line]
type = custom/text
content = %{T7}|%{T-}
content-background = ${colors.background}
content-foreground = ${colors.shadow}
content-font = 7

[module/space]
type = custom/text
content = " "
content-background = ${colors.background}
content-foreground = ${colors.background}

[module/left]
type = custom/text
; Для Chicago95 мы используем основной фон, так как стиль не подразумевает сильную прозрачность
content-background = ${colors.background}
content-foreground = ${colors.background}
content-font = 2
content = %{T3}%{T-}

[module/right]
type = custom/text
content-background = ${colors.background}
content-foreground = ${colors.background}
content-font = 2
content = %{T3}%{T-}

[module/start-left]
type = custom/text
; Используем символ с принудительным фоном и цветом
content = "%{F#ffffff}%{B#c0c0c0}|%{F-}%{B-}"
; Выбираем жирный шрифт, чтобы палочка была толще
content-font = 2
content-padding = 0

[module/start-right]
type = custom/text
; Темная палочка для правой грани
content = "%{F#404040}%{B#c0c0c0}|%{F-}%{B-}"
content-font = 2
content-padding = 0