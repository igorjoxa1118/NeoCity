[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false
reverse-scroll = false
fuzzy-match = true

ws-icon-0 = 1;
ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;
ws-icon-4 = 5;
ws-icon-5 = 6;
ws-icon-6 = 7;
ws-icon-7 = 8;
ws-icon-8 = 9;
ws-icon-9 = 10;
ws-icon-default =  

format = <label-mode> <label-state>
format-background = ${colors.background}
format-foreground = ${colors.maroon}
format-font = 9

label-mode = "%icon%"
label-mode-background = ${colors.yellow}
label-mode-foreground = ${colors.background}
label-mode-underline = ${colors.background}
label-mode-overline = ${colors.background}

label-focused = "%icon%"
label-focused-font = 9
label-focused-foreground = ${colors.active-blue}
label-focused-background = ${colors.background}
label-focused-underline = ${colors.background}
label-focused-overline = ${colors.background}

label-unfocused = "%icon%"
label-unfocused-font = 9
label-unfocused-background = ${colors.background}
label-unfocused-foreground = ${colors.darkshadow}

label-visible = "%icon%"
label-visible-font = 9
label-visible-background = ${colors.background}
label-visible-foreground = ${colors.maroon}

label-urgent = "%icon%"
label-urgent-font = 9
label-urgent-background = ${colors.background}
label-urgent-foreground = ${colors.red}

label-state = "%icon%"
label-state-background = ${colors.background}
label-state-foreground = ${colors.darkshadow}

label-mode-padding-left = 2
label-mode-padding-right = 2
label-focused-padding-left = 2
label-focused-padding-right = 2
label-unfocused-padding-left = 2
label-unfocused-padding-right = 2
label-urgent-padding-left = 2
label-urgent-padding-right = 2
label-visible-padding-left = 2
label-visible-padding-right = 2


