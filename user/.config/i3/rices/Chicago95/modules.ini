[module/arch]
type = custom/text

; %{+o} и %{+u} включают надчеркивание и подчеркивание (верх/низ)
; %{B...} и %{F...} управляют цветами фона и текста
; Мы используем заглавную 'I' или специальный символ, растянутый по вертикали
content = "%{o#ffffff}%{+o}%{u#404040}%{+u}%{F#ffffff}%{B#c0c0c0} %{F-}%{B-}  Start %{F#404040}%{B#c0c0c0} %{F-}%{B-}%{-u}%{-o}"

content-background = ${colors.background}
content-foreground = ${colors.foreground}
content-font = 1

; Увеличиваем высоту линий, чтобы они стали рамками
; Это должно быть согласовано с line-size в config.ini
content-overline-size = 2
content-underline-size = 2

click-left = ~/.config/i3/src/launchers/type-3/launcher.sh
click-right = ~/.config/i3/src/RiceSelector

[module/internet]
type = custom/text
format = <label>
