[section/base]
include-file = ~/.config/i3/rices/Chicago95/colors.ini
include-file = ~/.config/i3/rices/Chicago95/modules.ini
include-file = ~/.config/i3/rices/Chicago95/separator.ini

[bar/main]
monitor = ${env:MONITOR:}
monitor-strict = true
override-redirect = false
enable-ipc = true
bottom = true
fixed-center = true

width = 100%
height = 36px
#offset-x = 98%
#offset-y = 10px

padding-left = 0pt
padding-right = 0pt

module-margin-left = 0pt
module-margin-right = 0pt

background = ${colors.background}
foreground = ${colors.foreground}

# Имитация 3D границы сверху (как у панели задач Win95)
border-top-size = 2
border-top-color = ${colors.light}

line-size = 2
line-color = ${colors.foreground}

# Важно: для аутентичности лучше использовать шрифт 'MS Sans Serif'
;; Основной текст и иконки (центрируем по вертикали)
font-0 = "MesloLGS NF:style=Regular:size=13;4"
font-1 = "MesloLGS NF:style=Bold:size=13;4"

;; Скругления и крупные элементы (Font-2)
;; Оставляем FiraMono, так как в нем  выглядит идеально при 26;6
font-2 = "FiraMono Nerd Font:size=26;6"

;; Дополнительные шрифты (те самые размеры)
font-3 = "FiraMono Nerd Font:size=16;4"
font-4 = "HackGen35:size=12:weight=bold;4"
font-5 = "FiraMono Nerd Font:size=13;4"
font-6 = "MesloLGS NF:style=Regular:size=10;4"
font-7 = "Symbols Nerd Font:size=12;4"
font-8 = "Symbols Nerd Font:size=13;4"

modules-left = arch space line space terminal line zen line thunar line blender line kdenlive line ArmorPaint line telegram line gimp line kodi line code line fspy line pureref
modules-center = i3
modules-right = ymuse line mpd_total_time line space mpd space line mpd_back_time line systray line xkeyboard line time line powermenu