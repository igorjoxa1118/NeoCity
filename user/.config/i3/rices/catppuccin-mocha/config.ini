[global/wm]
include-file = colors.ini
include-file = icons_colors.ini
include-file = ~/.config/i3/config.d/system.ini
include-file = modules.ini
include-file = separator.ini

margin-top    = 0
margin-bottom = 0

[bar/main]
monitor = ${env:MONITOR:}
monitor-strict = true
override-redirect = false
enable-ipc = true

bottom = false

fixed-center = true

width = 100%
height = 44px
#offset-x = 98%
#offset-y = 10px

border-size = 5px
border-color = ${color.base_opacity}

line-size = 1pt

padding-left = 0pt
padding-right = 0pt

module-margin-left = 0pt
module-margin-right = 0pt

background = ${color.base_opacity}
foreground = ${color.base_opacity}

;; Основной текст и иконки (центрируем по вертикали)
font-0 = "MesloLGS NF:style=Regular:size=13;4"
font-1 = "MesloLGS NF:style=Bold:size=13;4"

;; Скругления и крупные элементы (Font-2)
;; Оставляем FiraMono, так как в нем  выглядит идеально при 26;6
font-2 = "FiraMono Nerd Font:size=26;6"

;; Дополнительные шрифты (те самые размеры)
font-3 = "FiraMono Nerd Font:size=16;4"
font-4 = "HackGen35:size=12:weight=bold;4"
font-5 = "FiraMono Nerd Font:size=13;4"
font-6 = "MesloLGS NF:style=Regular:size=10;4"
font-7 = "Symbols Nerd Font:size=12;4"
font-8 = "Symbols Nerd Font:size=13;4"

scroll-up = i3.next
scroll-down = i3.prev

modules-left = left arch space line cpu-speed space line space cpu line temperature space line system-nvidia-smi space line memory line disk space line space updates space line space space wallpapers right
modules-center = left pulseaudio line cava line space backlight_intel right 
modules-right = left network line xkeyboard line night_light bluetooth space line battery line systray line calendar space time space line space powermenu right

wm-restock = i3


[bar/secondary]
monitor = ${env:MONITOR:}
monitor-strict = true
override-redirect = false
enable-ipc = true

bottom = true

fixed-center = true

width = 100%
height = 44px

border-size = 5px
border-color = ${color.base_opacity}

line-size = 1

padding-left = 0
padding-right = 0

module-margin-left = 0
module-margin-right = 0

background = ${color.base_opacity}
foreground = ${color.base_opacity}

;; Основной текст и иконки (центрируем по вертикали)
font-0 = "MesloLGS NF:style=Regular:size=13;4"
font-1 = "MesloLGS NF:style=Bold:size=13;4"

;; Скругления и крупные элементы (Font-2)
;; Оставляем FiraMono, так как в нем  выглядит идеально при 26;6
font-2 = "FiraMono Nerd Font:size=26;6"

;; Дополнительные шрифты (те самые размеры)
font-3 = "FiraMono Nerd Font:size=16;4"
font-4 = "HackGen35:size=12:weight=bold;4"
font-5 = "FiraMono Nerd Font:size=13;4"
font-6 = "MesloLGS NF:style=Regular:size=10;4"
font-7 = "Symbols Nerd Font:size=12;4"
font-8 = "Symbols Nerd Font:size=13;4"

scroll-up = i3.next
scroll-down = i3.prev

modules-left = left terminal line zen line thunar line blender line kdenlive line ArmorPaint line telegram line gimp line kodi line code line fspy line pureref right
modules-center = left i3 right 
modules-right = left space steam space line bottom line space ymuse line mpd_total_time line space mpd space line mpd_back_time line space mpd_title space line shutdown_timer right

wm-restock = i3

[settings]
screenschange-reload = true
pseduo-transparency = true

